<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전술경연 대회 - 독서 RPG</title>
    <link rel="icon" href="logoicon.webp">
    <link rel="stylesheet" href="shared/lobby.css?v=20260823a">
    <link rel="stylesheet" href="arena/arena-battle.css?v=20260823a">
    <link rel="stylesheet" href="shared/attack-effects.css?v=20260823a">
    <link rel="stylesheet" href="shared/achievement-toast.css?v=20260823a">
    <link rel="stylesheet" href="gacha/gacha-reveal.css?v=20260823a">
</head>
<body>
    <div class="battle-screen">
        <div class="battle-timer-row">
            <div class="battle-timer" id="battle-timer">03:00</div>
            <!-- 코스트 덱(cost_init 처리 시 arena-battle.js가 여기서 이 버튼을 옮겨간다)이 뜨기 전까지는
                 숨겨둔다 - 안 그러면 전투 시작 직후 잠깐 이 원래 자리(타이머 옆)에서 보였다가 코스트
                 덱으로 "점프"하는 게 눈에 띈다. -->
            <button type="button" class="battle-speed-toggle" id="battle-speed-toggle" aria-label="재생 속도 전환" title="재생 속도 전환" hidden></button>
        </div>

        <div class="battle-layout">

            <!-- 좌측: 나 -->
            <div class="player-panel" data-side="attacker">
                <div class="player-identity">
                    <div class="player-avatar-frame">
                        <img class="player-avatar" id="attacker-avatar" src="" alt="내 대표 캐릭터">
                    </div>

                    <div class="player-summary">
                        <div class="player-name" id="attacker-name">-</div>
                        <div class="card-divider"></div>
                        <div class="player-meta">
                            Lv.<span id="attacker-level">-</span>
                        </div>
                        <div class="player-title-line" id="attacker-title">칭호 없음</div>
                    </div>
                </div>

                <div class="roster-unit" data-roster="attacker-front">
                    <div class="roster-unit-thumb">
                        <img class="roster-unit-img" src="" alt="">
                    </div>
                    <div class="roster-unit-body">
                        <div class="roster-name-row">
                            <div class="roster-unit-name">-</div>
                            <div class="roster-status-icons"></div>
                        </div>
                        <div class="roster-shield-track" hidden>
                            <div class="roster-shield-fill"></div>
                        </div>
                        <div class="roster-hp-track">
                            <div class="roster-hp-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="roster-unit" data-roster="attacker-back">
                    <div class="roster-unit-thumb">
                        <img class="roster-unit-img" src="" alt="">
                    </div>
                    <div class="roster-unit-body">
                        <div class="roster-name-row">
                            <div class="roster-unit-name">-</div>
                            <div class="roster-status-icons"></div>
                        </div>
                        <div class="roster-shield-track" hidden>
                            <div class="roster-shield-fill"></div>
                        </div>
                        <div class="roster-hp-track">
                            <div class="roster-hp-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- 전투 로그: 배경 위에 색 텍스트만 스크롤되는 형태 (박스/테두리 없음) -->
                <div class="battle-log-panel" id="battle-log-panel"></div>
            </div>

            <!-- 중앙: 실제 전투 캐릭터 -->
            <div class="battle-field">
                <div class="projectile-layer" id="projectile-layer"></div>

                <div class="battle-row">
                    <!-- 소환수(summon) 자리 - 평소엔 비어있다가(hidden) 윤영준류의 "추가 소환" 스킬이 발동될 때만 나타남.
                         기존 전방/후방을 대체하지 않는 추가 유닛이라 대열 바깥쪽 끝에 둔다. 시전자가 front/back
                         어느 쪽이든 각자 전용 자리를 가지므로(summon-front/summon-back) 한 팀에 복제체를 만드는
                         캐릭터가 둘이어도 서로 밀어내지 않고 동시에 존재할 수 있다. -->
                    <div class="battle-unit" data-unit="attacker-summon-front" hidden>
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>
                    <div class="battle-unit" data-unit="attacker-summon-back" hidden>
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>

                    <div class="battle-unit" data-unit="attacker-back">
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>

                    <div class="battle-unit" data-unit="attacker-front">
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>

                    <div class="battle-unit" data-unit="defender-front">
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>

                    <div class="battle-unit" data-unit="defender-back">
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>

                    <div class="battle-unit" data-unit="defender-summon-front" hidden>
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>
                    <div class="battle-unit" data-unit="defender-summon-back" hidden>
                        <img class="battle-unit-img" src="" alt="">
                        <div class="battle-unit-shadow"></div>
                    </div>
                </div>

                <div class="battle-field-line"></div>
            </div>

            <!-- 우측: 상대 -->
            <div class="player-panel" data-side="defender">
                <div class="player-identity">
                    <div class="player-avatar-frame">
                        <img class="player-avatar" id="defender-avatar" src="" alt="상대 대표 캐릭터">
                    </div>

                    <div class="player-summary">
                        <div class="player-name" id="defender-name">-</div>
                        <div class="card-divider"></div>
                        <div class="player-meta">
                            Lv.<span id="defender-level">-</span>
                        </div>
                        <div class="player-title-line" id="defender-title">칭호 없음</div>
                    </div>
                </div>

                <div class="roster-unit" data-roster="defender-front">
                    <div class="roster-unit-thumb">
                        <img class="roster-unit-img" src="" alt="">
                    </div>
                    <div class="roster-unit-body">
                        <div class="roster-name-row">
                            <div class="roster-unit-name">-</div>
                            <div class="roster-status-icons"></div>
                        </div>
                        <div class="roster-shield-track" hidden>
                            <div class="roster-shield-fill"></div>
                        </div>
                        <div class="roster-hp-track">
                            <div class="roster-hp-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="roster-unit" data-roster="defender-back">
                    <div class="roster-unit-thumb">
                        <img class="roster-unit-img" src="" alt="">
                    </div>
                    <div class="roster-unit-body">
                        <div class="roster-name-row">
                            <div class="roster-unit-name">-</div>
                            <div class="roster-status-icons"></div>
                        </div>
                        <div class="roster-shield-track" hidden>
                            <div class="roster-shield-fill"></div>
                        </div>
                        <div class="roster-hp-track">
                            <div class="roster-hp-fill"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 코스트 게이지 + 스킬카드(전방/후방/서포터) - 내용은 arena-battle.js가 cost_init 이벤트를
             받아서 만든다. .battle-field 밖(.battle-screen 바로 아래)에 둬야 한다 - .battle-field
             안에 있으면, 김어진 "불빠따" 등이 화면을 흔들 때(.ground-fire-shake, transform 사용) 그
             transform이 있는 조상 안의 position:fixed 자손은 뷰포트가 아니라 그 조상 기준으로
             재배치되는 CSS 규칙 때문에 코스트덕까지 같이 흔들렸다(확인된 버그). 가로 위치는
             shared/battle-renderer.js의 positionCostDock()이 .battle-field의 실제 위치를 측정해서
             JS로 맞춘다(원래의 "필드 오른쪽 끝에서 6px" 정렬을 그대로 재현) - 세로는 CSS(bottom)로
             항상 화면 맨 아래에 고정한다. -->
        <div class="cost-dock" id="cost-dock-attacker" data-cost-side="attacker" hidden></div>

        <div class="battle-result" id="battle-result" hidden>
            <div class="battle-result-text" id="battle-result-text">-</div>
            <div class="battle-result-gold" id="battle-result-gold" hidden>+5G</div>
            <button class="dungeon-enter-btn" id="battle-close-btn">닫기</button>
        </div>
    </div>

    <!-- "입장하는 중..." 점 애니메이션/팁은 로비(home.html)에서 이미 보여줬다 - 여기서는 페이지가 막
         로드된 짧은 순간만 가려주는 용도라 정적 문구만 둔다. -->
    <div class="battle-loading-overlay" id="battle-loading-overlay">
        <div class="battle-loading-text">입장하는 중...</div>
    </div>

    <script src="shared/api-config.js?v=20260823a"></script>
    <script src="shared/session-guard.js?v=20260823a"></script>
    <script src="shared/nav-lock.js?v=20260823a"></script>
    <script src="shared/avatar-crop.js?v=20260823a"></script>
    <script src="shared/achievement-toast.js?v=20260823a"></script>
    <script src="shared/attack-effects.js?v=20260823a"></script>
    <script src="shared/battle-renderer.js?v=20260823a"></script>
    <script src="gacha/gacha-reveal.js?v=20260823a" defer></script>
    <script src="arena/arena-battle.js?v=20260823a" defer></script>
</body>
</html>
