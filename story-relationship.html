<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인연 스토리 - 독서 RPG</title>
<link rel="icon" href="logoicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="story/story-relationship.css?v=20260905">
<link rel="stylesheet" href="shared/achievement-toast.css?v=20260905">
<link rel="stylesheet" href="gacha/gacha-reveal.css?v=20260905">
<link rel="stylesheet" href="gacha/gacha-cinematic.css?v=20260905">
</head>
<body>

<div id="lobby-wrap">
  <div id="lobby-stage">

    <div id="lobby-home" class="lobby-screen show">
      <img id="lobby-cover" src="assets/story/ep2/lobby/cover.webp" alt="">
      <div id="lobby-title-overlay">
        <div id="lobby-game-title">인연 스토리</div>
      </div>
      <div class="vn-ticket-chip"><img class="vn-ticket-icon" src="assets/items/story_ticket.webp" alt="" onerror="this.style.display='none'"> <span id="vn-ticket-value-home">0</span></div>
      <div id="lobby-menu">
        <button class="lobby-btn" id="btn-episodes">Episode 선택</button>
        <button class="lobby-btn" id="btn-gallery">도감</button>
        <button class="lobby-btn" id="btn-exit">나가기</button>
      </div>
    </div>

    <div id="lobby-episodes" class="lobby-screen">
      <div class="lobby-header">
        <button class="lobby-back">◀ 뒤로</button>
        <span class="lobby-header-title">Episode 선택</span>
        <div class="vn-ticket-chip"><img class="vn-ticket-icon" src="assets/items/story_ticket.webp" alt="" onerror="this.style.display='none'"> <span id="vn-ticket-value-episodes">0</span></div>
      </div>
      <div class="lobby-episode-grid">
        <div class="episode-card" id="episode-card-1">
          <img src="assets/story/ep1/lobby/episode1_thumb.jpg" alt="">
          <div class="episode-card-label">Episode 1<br><span id="ep1-status">우정의 시작</span></div>
        </div>
        <div class="episode-card" id="episode-card-2">
          <img src="assets/story/ep2/lobby/episode2_thumb.webp" alt="">
          <div class="episode-card-label">Episode 2<br><span id="ep2-status">귀환의 돌</span></div>
        </div>
        <div class="episode-card locked">
          <div class="episode-card-empty">?</div>
          <div class="episode-card-label">Episode 3<br><span>준비 중</span></div>
        </div>
      </div>
    </div>

    <!-- 신규: Episode 카드 클릭 시 바로 시작하지 않고 이 상세 화면으로 진입 -->
    <div id="lobby-episode-detail" class="lobby-screen">
      <div class="lobby-header">
        <button class="lobby-back" id="episode-detail-back-btn">◀ 뒤로</button>
        <span class="lobby-header-title">Episode 1</span>
        <div class="vn-ticket-chip"><img class="vn-ticket-icon" src="assets/items/story_ticket.webp" alt="" onerror="this.style.display='none'"> <span id="vn-ticket-value-detail">0</span></div>
      </div>
      <div class="episode-detail-body">
        <div class="episode-detail-title">Episode 1 · 우정의 시작</div>
        <p class="episode-detail-desc">평범한 학교 생활 속, 우연이 겹치며 시작되는 인연 이야기.</p>

        <button class="episode-detail-start-btn" id="episode-detail-start-btn" type="button">시작하기</button>
        <button class="lobby-back" id="episode-detail-restart-btn" type="button" style="display:none;">처음부터 다시 시작</button>

        <div class="vn-autouse-row">
          <div>
            <div class="vn-autouse-label">티켓 자동 사용</div>
            <div class="vn-autouse-sub">켜두면 씬 전환 시 확인 없이 티켓이 바로 소모됩니다.</div>
          </div>
          <label class="vn-switch">
            <input type="checkbox" id="vn-autouse-toggle">
            <span class="vn-switch-track"></span>
          </label>
        </div>
      </div>
    </div>

    <div id="lobby-gallery" class="lobby-screen">
      <div class="lobby-header">
        <button class="lobby-back">◀ 뒤로</button>
        <span class="lobby-header-title">COLLECTION</span>
        <span class="gallery-summary" id="gallery-summary">0 / 11</span>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <div id="gallery-modal" aria-hidden="true">
      <div id="gallery-modal-box">
        <div id="gallery-modal-header">
          <div id="gallery-modal-title"></div>
          <button id="gallery-modal-close" aria-label="닫기">✕</button>
        </div>
        <div id="gallery-modal-content"></div>
      </div>
    </div>

  </div>
</div>

<div id="stage">
  <audio id="bgm-player" loop preload="none"></audio>
  <div class="vn-ticket-chip"><img class="vn-ticket-icon" src="assets/items/story_ticket.webp" alt="" onerror="this.style.display='none'"> <span id="vn-ticket-value-stage">0</span></div>
  <div id="scene-fade"></div>
  <div id="time-card-overlay" aria-hidden="true">
    <div id="time-card-text"></div>
  </div>
  <div id="bg-mood"></div>
  <div id="bg-vignette"></div>

  <!-- Episode 2 신규 연출 전용 오버레이(story-engine.js triggerExplosion/setLetterbox/triggerGlitch/
       triggerShockReveal 참고) - 평소엔 전부 비어있다가 필요한 순간에만 클래스 토글로 나타난다. -->
  <div id="fx-flash"></div>
  <div id="fx-shockwave"></div>
  <div id="fx-letterbox-top"></div>
  <div id="fx-letterbox-bottom"></div>
  <div id="fx-glitch"></div>
  <div id="fx-speedlines"></div>

  <!-- Episode 2 소품(상자 자물쇠 등) 텍스트 입력 UI - 모모톡 채팅과 무관한 범용 입력이라
       showComposeInput(모모톡 창이 열려 있어야만 보임)과 분리된 자체 오버레이를 쓴다 -->
  <div id="prop-input-layer">
    <div id="prop-input-box">
      <div id="prop-input-label"></div>
      <input id="prop-input-field" type="text" maxlength="60" autocomplete="off">
      <button id="prop-input-confirm" type="button">확인</button>
    </div>
  </div>

  <!-- Episode 2 편지 연출(story/story-sub-engine.js의 openLetter/closeLetter와 같은 방식) -->
  <div id="letter-layer">
    <div id="letter-stack">
      <div id="letter-envelope"><img id="letter-envelope-img" src="" alt=""></div>
      <div id="letter-paper">
        <img id="letter-paper-img" src="" alt="">
        <div id="letter-paper-text"></div>
      </div>
    </div>
  </div>

  <div id="stage-top-btns">
    <button id="zoom-btn" type="button">확대</button>
    <button id="log-btn" type="button">대사</button>
    <button id="menu-btn">메뉴</button>
  </div>

  <!-- tv-scan-mask/tv-scan-pattern: 통화/방송 스탠딩의 움직이는 실선무늬(story-relationship.css의
       #char-*.tv-static 규칙, story-engine.js의 setCharTvStatic 참고). mask는 실루엣 모양으로 고정된 채
       (--tv-mask-image로 지금 스탠딩과 같은 이미지를 마스크로 씀) 안쪽 무늬 레이어만 transform으로
       계속 흘러내리게 해서, background-position 애니메이션이 유발하던 렉 없이 GPU 합성만으로 움직인다. -->
  <div id="char-left"><img id="char-left-img" src="" alt="" decoding="async"><div class="tv-scan-mask"><div class="tv-scan-pattern"></div></div></div>
  <div id="char-center"><img id="char-center-img" src="" alt="" decoding="async"><div class="tv-scan-mask"><div class="tv-scan-pattern"></div></div></div>
  <div id="char-right"><img id="char-right-img" src="" alt="" decoding="async"><div class="tv-scan-mask"><div class="tv-scan-pattern"></div></div></div>

  <!-- Episode 2 아이템 등장(귀환의 돌 등) - 중앙 캐릭터가 옆으로 비켜서는 동안 그 자리(살짝 위쪽)에
       부드러운 사각형 컨테이너 안에서 아이템이 나타난다 -->
  <div id="item-display">
    <div id="item-display-box"><img id="item-display-img" src="" alt=""></div>
  </div>

  <div id="phone-layer">
    <div id="phone-window">
      <div id="phone-header"><span id="phone-icon">♠</span> BugoTalk</div>
      <div id="phone-body">
        <div id="phone-contacts"></div>
        <div id="phone-chat">
          <div id="chat-messages"></div>
          <div id="phone-compose">
            <input id="phone-compose-input" type="text" placeholder="메시지를 입력하세요" maxlength="60">
            <button id="phone-compose-send">전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="dialogue-wrap">
    <div id="nameplate">
      <span id="name-main"></span>
      <span class="sub" id="name-sub"></span>
    </div>
    <div id="box">
      <div id="line-text"></div>
      <div id="advance-hint">클릭해서 계속 ▶</div>
    </div>
  </div>

  <div id="choice-layer"></div>

  <div id="end-layer">
    <h2 id="end-title">씬 종료</h2>
    <div class="affection" id="end-affection"></div>
    <button id="restart-btn">로비로</button>
  </div>
</div>

<!-- 신규: 씬 전환 티켓 확인 모달 -->
<div class="vn-ticket-modal" id="vn-ticket-confirm-modal">
  <div class="vn-ticket-modal-box">
    <div class="vn-ticket-modal-text">티켓을 사용하여<br>이어서 보시겠습니까?</div>
    <div class="vn-ticket-modal-btns">
      <button class="vn-ticket-modal-btn primary" id="vn-ticket-confirm-ok">확인</button>
      <button class="vn-ticket-modal-btn" id="vn-ticket-confirm-cancel">취소</button>
    </div>
  </div>
</div>

<!-- 신규: 티켓 소모 처리 대기 표시(요청됨) - 확인 모달을 닫은 뒤 서버 응답을 기다리는 동안 화면이
     아무 반응 없이 멈춘 것처럼 보이던 문제(신고받아 수정) - 실제로 처리 중임을 보여준다. -->
<div class="vn-ticket-modal" id="vn-scene-loading-modal">
  <div class="vn-ticket-modal-box">
    <div class="vn-loading-spinner"></div>
  </div>
</div>

<!-- 신규: 티켓 부족 모달 -->
<div class="vn-ticket-modal" id="vn-ticket-insufficient-modal">
  <div class="vn-ticket-modal-box">
    <div class="vn-ticket-modal-text">티켓이 부족합니다</div>
    <div class="vn-ticket-modal-btns">
      <button class="vn-ticket-modal-btn primary" id="vn-ticket-insufficient-ok">확인</button>
    </div>
  </div>
</div>

<!-- 신규: 대화 기록(대사 로그) 모달 -->
<div id="vn-log-modal" aria-hidden="true">
  <div id="vn-log-modal-box">
    <div id="vn-log-modal-header">
      <div id="vn-log-modal-title">대화 기록</div>
      <button id="vn-log-modal-close" type="button" aria-label="닫기">✕</button>
    </div>
    <div id="vn-log-modal-content"></div>
  </div>
</div>

<!-- 신규: 스토리 진행 중 메뉴 모달 -->
<div class="vn-ticket-modal" id="vn-menu-modal">
  <div class="vn-ticket-modal-box">
    <div class="vn-menu-title">메뉴</div>
    <div class="vn-ticket-modal-btns">
      <button class="vn-ticket-modal-btn primary" id="vn-menu-resume">이어하기</button>
      <button class="vn-ticket-modal-btn" id="vn-menu-save-exit">저장 및 종료</button>
    </div>
  </div>
</div>

<!-- 신규: 티켓 자동 사용 켤 때 1회 안내 모달 -->
<div class="vn-ticket-modal" id="vn-autouse-info-modal">
  <div class="vn-ticket-modal-box">
    <div class="vn-ticket-modal-text">다음 씬으로 넘어갈 때<br>티켓이 자동으로 소모됩니다.</div>
    <div class="vn-ticket-modal-btns">
      <button class="vn-ticket-modal-btn primary" id="vn-autouse-info-ok">확인</button>
    </div>
  </div>
</div>

<script src="shared/api-config.js?v=20260905"></script>
<script src="shared/session-guard.js?v=20260905"></script>
<script src="shared/nav-lock.js?v=20260905"></script>
<script src="shared/avatar-crop.js?v=20260905"></script>
<script src="shared/achievement-toast.js?v=20260905"></script>
<script src="gacha/gacha-reveal.js?v=20260905"></script>
<script src="gacha/gacha-cinematic.js?v=20260905"></script>
<script src="story/scenario/ep1_yoondaewoong.js?v=20260905"></script>
<script src="story/scenario/ep2_choijaehyeok.js?v=20260905"></script>
<script src="story/story-engine.js?v=20260905"></script>
</body>
</html>
